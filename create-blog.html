<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Write a new post — Inkwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <a href="index.html" class="brand">Inkwell<span class="brand-dot">.</span></a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="create-blog.html" class="active">Write</a>
    </nav>
    <div class="nav-actions" data-nav-auth></div>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<form class="editor-shell" id="editorForm" novalidate>
  <div class="editor-top">
    <a href="dashboard.html" class="btn btn-ghost">← Back to dashboard</a>
  </div>

  <input
    type="text"
    class="editor-title-input"
    id="editorTitle"
    name="title"
    placeholder="Your post title"
    autocomplete="off"
  />

  <div class="editor-meta-row">
    <div class="field">
      <label for="category">Category</label>
      <select id="category" name="category">
        <option>Craft</option>
        <option>Process</option>
        <option>Behind the scenes</option>
        <option>Essay</option>
        <option>Field notes</option>
      </select>
    </div>
  </div>

  <textarea
    class="editor-body-input"
    id="editorBody"
    name="body"
    placeholder="Start writing…"
  ></textarea>

  <div class="editor-footer">
    <span class="word-count" id="wordCount">0 words</span>
    <div class="row-actions">
      <button type="button" class="btn btn-outline" id="saveDraftBtn">Save as draft</button>
      <button type="submit" class="btn btn-primary">Publish</button>
    </div>
  </div>
</form>

<script src="js/script.js"></script>
</body>
</html>
